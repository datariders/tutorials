<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Architecture: end user to intent agent to Bifrost gateway to Bedrock and Anthropic</title>
<desc>An end user sends a query to an intent-routing agent, which forwards it to the Bifrost gateway running on Amazon ECS. The gateway enforces rate limits, budgets, and semantic caching, then routes the request to either Amazon Bedrock or the Anthropic API depending on the classified intent.</desc>

<rect width="900" height="300" fill="#F7F6F2"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="450" y="30" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2C2C2A">Intent-based agent routing with Bifrost on AWS</text>

<!-- End user -->
<rect x="40" y="60" width="150" height="56" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="115" y="83" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2C2C2A">End user</text>
<text x="115" y="102" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#2C2C2A">Sends a query</text>

<!-- Intent agent -->
<rect x="230" y="60" width="170" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="315" y="83" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" fill="#085041">Intent agent</text>
<text x="315" y="102" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#085041">Classifies intent</text>

<!-- Bifrost gateway -->
<rect x="440" y="60" width="220" height="56" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="550" y="83" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" fill="#3C3489">Bifrost gateway</text>
<text x="550" y="102" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#3C3489">ECS Fargate, routing</text>

<!-- connectors: user -> agent -> bifrost -->
<line x1="190" y1="88" x2="228" y2="88" stroke="#5F5E5A" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="400" y1="88" x2="438" y2="88" stroke="#5F5E5A" stroke-width="2" marker-end="url(#arrow)"/>

<!-- bifrost -> bedrock / anthropic -->
<line x1="510" y1="116" x2="425" y2="220" stroke="#5F5E5A" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="590" y1="116" x2="650" y2="220" stroke="#5F5E5A" stroke-width="2" marker-end="url(#arrow)"/>

<!-- capability badges -->
<rect x="440" y="135" width="88" height="24" rx="12" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
<text x="484" y="151" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">Rate limit</text>

<rect x="536" y="135" width="70" height="24" rx="12" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
<text x="571" y="151" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">Budget</text>

<rect x="614" y="135" width="128" height="24" rx="12" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
<text x="678" y="151" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3C3489">Semantic cache</text>

<!-- Amazon Bedrock -->
<rect x="330" y="220" width="190" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<text x="425" y="243" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" fill="#0C447C">Amazon Bedrock</text>
<text x="425" y="262" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#0C447C">Claude via Bedrock</text>

<!-- Anthropic API -->
<rect x="560" y="220" width="180" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<text x="650" y="243" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" fill="#712B13">Anthropic API</text>
<text x="650" y="262" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#712B13">Claude, direct</text>

</svg>
